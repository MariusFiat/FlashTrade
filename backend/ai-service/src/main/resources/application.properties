spring.application.name=ai-service
server.port=8083

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flashtrade}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Python Configuration
python.executable=python3
python.scripts.path=src/main/java/ML

# API Keys (get free keys from these services)
news.api.key=${NEWS_API_KEY:demo}
alpha.vantage.api.key=${ALPHA_VANTAGE_KEY:demo}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.example.ai_service=DEBUG
logging.level.org.springframework.amqp=DEBUG