spring.application.name=trading-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.data-source-properties.sslmode=require

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=false

finnhub.api.key=d5h1v4hr01qll3dlbtu0d5h1v4hr01qll3dlbtug
finnhub.base.url=https://finnhub.io/api/v1

# RabbitMQ Batch Configuration
# Enable batch listener (passes List<Type> to your method)
spring.rabbitmq.listener.simple.consumer-batch-enabled=true

# The Target: Try to collect 500 messages
spring.rabbitmq.listener.simple.batch-size=500

# The Timeout: If 500 don't arrive within 100ms, process whatever you have
spring.rabbitmq.listener.simple.batch-receive-timeout=100

# Prefetch must be >= batch-size to allow the buffer to fill
spring.rabbitmq.listener.simple.prefetch=500