# This file is automatically loaded by docker-compose for local development
# It adds PostgreSQL database to the stack
# For production/demo with external DB, run: docker-compose -f docker-compose.yml up

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - flashtrade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Override user-service to wait for postgres
  user-service:
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  # Override trading-service to wait for postgres
  trading-service:
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

volumes:
  postgres-data:
